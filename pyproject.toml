[project]
name = "fuel-route-optimizer"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django==6.1.3",
    "djangorestframework==3.18.3",
    "drf-spectacular==0.30.0",
    "gunicorn==27.0.1",
    "psycopg[binary]==3.3.9",
]

[dependency-groups]
dev = [
    "mutmut==3.8.1",
    "pytest",
    "pytest-django==4.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["fuel_route/domain/"]
pytest_add_cli_args_test_selection = ["tests/domain/"]
pytest_add_cli_args = ["-p", "no:django"]
