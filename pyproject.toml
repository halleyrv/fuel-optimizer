[project]
name = "fuel-route-optimizer"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django==6.1.3",
    "djangorestframework==3.18.3",
    "psycopg[binary]==3.3.9",
]

[dependency-groups]
dev = ["pytest", "pytest-django==4.14.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
